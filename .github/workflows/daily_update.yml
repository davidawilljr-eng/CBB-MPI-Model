name: Daily CBB MPI Model Update

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full CBB MPI pipeline
        run: |
          python src/fetch_data.py
          python src/ratings.py
          python src/simulations.py
          python src/bracketology.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily CBB MPI update" && git push)
